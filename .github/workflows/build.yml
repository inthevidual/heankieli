name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: Metal is always on
          - name: macOS-AppleSilicon
            os: macos-latest
            features: ""
          # Vulkan runs on NVIDIA, AMD and Intel GPUs with the normal driver,
          # without shipping the CUDA runtime
          - name: Windows-x64
            os: windows-latest
            features: "--features vulkan"
          - name: Linux-x64
            os: ubuntu-22.04
            features: "--features vulkan"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libxdo-dev build-essential cmake libvulkan-dev

      - name: Vulkan SDK
        if: runner.os != 'macOS'
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Frontend
        run: |
          npm ci
          npm test
          npm run check

      # ffmpeg 9.0.2 travels with the app on macOS and Windows; Linux uses the system's
      - name: ffmpeg for macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p src-tauri/binaries && cd src-tauri/binaries
          base=https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2
          curl -sfL -o ffmpeg.zip $base/ffmpeg.zip
          curl -sfL -o ffprobe.zip $base/ffprobe.zip
          echo "c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924  ffmpeg.zip" | shasum -a 256 -c
          echo "fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6  ffprobe.zip" | shasum -a 256 -c
          unzip -o ffmpeg.zip && unzip -o ffprobe.zip && rm *.zip
          mv ffmpeg ffmpeg-aarch64-apple-darwin && mv ffprobe ffprobe-aarch64-apple-darwin
          chmod +x ffmpeg-* ffprobe-*
          ./ffmpeg-aarch64-apple-darwin -hide_banner -version | sed -n 1p

      - name: ffmpeg for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $zip = "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest -Uri https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "60F467265B1E312373DBCD92200C2618A74850F98D3D078E94296BB3FA2047BA") { throw "ffmpeg checksum mismatch" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/ff"
          Copy-Item "$env:RUNNER_TEMP/ff/ffmpeg-9.0.2-essentials_build/bin/ffmpeg.exe" src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item "$env:RUNNER_TEMP/ff/ffmpeg-9.0.2-essentials_build/bin/ffprobe.exe" src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -version | Select-Object -First 1

      - name: Build
        shell: bash
        run: |
          # MSBuild's file tracker fails on the long paths of whisper.cpp's
          # Vulkan shader build, so Windows builds in a short folder
          if [ "$RUNNER_OS" = Windows ]; then
            export CARGO_TARGET_DIR=C:/t
            npx tauri build ${{ matrix.features }}
            mkdir -p src-tauri/target/release && cp -r C:/t/release/bundle src-tauri/target/release/
          else
            npx tauri build ${{ matrix.features }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Heankieli-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
