[package]
name = "heankieli"
version = "0.1.0"
description = "PlumppuVox Heänkieli – local transcription and subtitling"
authors = ["inthevidual"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[lib]
name = "heankieli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16"
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.11"
hex = "0.4"
sys-locale = "0.3"

# Apple Silicon: always build with Metal.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[features]
# Linux/Windows GPU back ends, chosen at build time (see README).
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
